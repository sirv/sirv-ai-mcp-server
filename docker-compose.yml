services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3001
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_BASE_URL=${MCP_BASE_URL:-https://mcp.sirv.studio}
      - SIRV_AI_BASE_URL=${SIRV_AI_BASE_URL:-https://www.sirv.studio}
      - MCP_ENABLE_IP_ALLOWLIST=false
      - MCP_TRUST_PROXY=1
      - AUTH_SECRET=${AUTH_SECRET}
      - MCP_JWT_SECRET=${MCP_JWT_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
